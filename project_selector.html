      { id: 43, name: "Oracle Keepalive Daemon", cat: "TOOLS", path: "Desktop\\oracle hesaplarının...", desc: "Oracle Cloud Free Tier sunucularının geri alınmasını önleyen yük oluşturucu.", tags: ["Bash", "Python"], rec: "public", recReason: "Öneri: 🌐 Public (Çok Yararlı Script)" },
      { id: 44, name: "OTO DM Engine", cat: "TOOLS", path: "Desktop\\OTO_DM", desc: "Toplu DM gönderme motoru altyapısı.", tags: ["Python"], rec: "private", recReason: "Öneri: 🔒 Private" },
      { id: 45, name: "Search API Service", cat: "TOOLS", path: "Desktop\\search api", desc: "Özel arama motoru API uç noktası servisi.", tags: ["Python", "FastAPI"], rec: "public", recReason: "Öneri: 🌐 Public" },
      { id: 46, name: "API Kasa Security", cat: "TOOLS", path: "Desktop\\API_Kasa", desc: "Güvenli API anahtarı ve şifreli veri kasası.", tags: ["Python", "Cryptography"], rec: "private", recReason: "Öneri: 🔒 Private (Hassas Kasa)" },
      { id: 47, name: "Atatürk Otomasyon", cat: "TOOLS", path: "Desktop\\Ataturk_Otomasyon", desc: "Özel otomasyon ve betik modülleri kütüphanesi.", tags: ["Python"], rec: "private", recReason: "Öneri: 🔒 Private" },
      { id: 48, name: "Clawcode Compiler Tool", cat: "TOOLS", path: "Desktop\\clawcode", desc: "Kod işleme ve dönüştürme aracı.", tags: ["C++", "Python"], rec: "public", recReason: "Öneri: 🌐 Public" },
      { id: 49, name: "Codex Account Switcher", cat: "TOOLS", path: "Desktop\\Codex Account Switcher", desc: "Masaüstü hızlı hesap değiştirme yazılımı.", tags: ["Python", "Tkinter"], rec: "private", recReason: "Öneri: 🔒 Private" },
      { id: 50, name: "Mernis Tooling", cat: "TOOLS", path: "Desktop\\Mernis", desc: "Mernis sorgulama ve veri işleme yazılımı.", tags: ["Python"], rec: "offgrid", recReason: "Öneri: ☣️ Off-Grid Engine (Hassas Veri / GitHub'a Yükleme)" },

      // Yaratıcı & Ar-Ge
      { id: 51, name: "NEBULA 3D Galaxy", cat: "CREATIVE", path: "Desktop\\Galaksi Sitesi2", desc: "WebGL ve Three.js ile N-body parçacık galaksi simülasyonu.", tags: ["Three.js", "WebGL", "JavaScript"], rec: "public", recReason: "Öneri: 🌐 Public (3D WebGL Büyüleyici Vitrin)" },
      { id: 52, name: "LOVECRAFT Interaktif Web", cat: "CREATIVE", path: "Desktop\\...Projeler\\irem.ninja", desc: "12+ mini oyun içeren interaktif romantik web uygulaması.", tags: ["Vanilla JS", "Firebase", "PWA"], rec: "public", recReason: "Öneri: 🌐 Public (Yaratıcılık Göstergesi)" },
      { id: 53, name: "Rainbow Effect Canvas", cat: "CREATIVE", path: "Desktop\\Rainbow effect", desc: "Tuval (Canvas) üzerinde dinamik gökkuşağı efekti.", tags: ["HTML5 Canvas", "CSS3"], rec: "public", recReason: "Öneri: 🌐 Public" },
      { id: 54, name: "WiFi Body Detection Ar-Ge", cat: "CREATIVE", path: "Desktop\\...Projeler\\wifi sinyalleriyle...", desc: "WiFi sinyal dalgalanmalarıyla insan beden ve hareket tespiti.", tags: ["Python", "Signal Processing", "Ar-Ge"], rec: "public", recReason: "Öneri: 🌐 Public (Çok Dikkat Çekici İnovatif Ar-Ge)" }
    ];

    // User selections memory (default to recommendations)
    const STORAGE_KEY = 'tekedev_project_selections';
    const userSelections = {};

    // Kaydedilmiş seçimleri yükle, yoksa önerileri kullan
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        projectsData.forEach(p => userSelections[p.id] = parsed[p.id] || p.rec);
      } catch (e) {
        projectsData.forEach(p => userSelections[p.id] = p.rec);
      }
    } else {
      projectsData.forEach(p => userSelections[p.id] = p.rec);
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(userSelections));
    }

    let currentCategory = 'ALL';

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function selectOption(id, choice) {
      userSelections[id] = choice;
      saveToStorage();
      render();
    }

    function render() {
      const grid = document.getElementById('grid');
      const search = document.getElementById('search').value.toLowerCase();
      grid.innerHTML = '';

      let filtered = projectsData.filter(p => {
        const matchesCat = (currentCategory === 'ALL' || p.cat === currentCategory);
        const matchesSearch = p.name.toLowerCase().includes(search) ||
                              p.desc.toLowerCase().includes(search) ||
                              p.tags.some(t => t.toLowerCase().includes(search));
        return matchesCat && matchesSearch;
      });

      filtered.forEach(p => {
        const selected = userSelections[p.id];
        const card = document.createElement('div');
        card.className = 'card';
        
        let recBadgeClass = 'rec-public';
        if (p.rec === 'private') recBadgeClass = 'rec-private';
        if (p.rec === 'offgrid') recBadgeClass = 'rec-offgrid';

        card.innerHTML = `
          <div>
            <div class="card-num">#${p.id}</div>
            <div class="card-cat">${p.cat}</div>
            <div class="card-title">${p.name}</div>
            <div class="card-path">📁 ${p.path}</div>
            <div class="card-desc">${p.desc}</div>
            <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </div>
          <div>
            <div class="rec-badge ${recBadgeClass}">${p.recReason}</div>
            <div class="choice-group">
              <button class="choice-btn ${selected === 'public' ? 'selected-public' : ''}" onclick="selectOption(${p.id}, 'public')">🌐 Public</button>
              <button class="choice-btn ${selected === 'private' ? 'selected-private' : ''}" onclick="selectOption(${p.id}, 'private')">🔒 Private</button>
              <button class="choice-btn ${selected === 'offgrid' ? 'selected-offgrid' : ''}" onclick="selectOption(${p.id}, 'offgrid')">☣️ Off-Grid</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      updateStats();
    }

    function updateStats() {
      let pub = 0, priv = 0, off = 0;
      Object.values(userSelections).forEach(val => {
        if (val === 'public') pub++;
        if (val === 'private') priv++;
        if (val === 'offgrid') off++;
      });

      document.getElementById('cnt-total').innerText = projectsData.length;
      document.getElementById('cnt-public').innerText = pub;
      document.getElementById('cnt-private').innerText = priv;
      document.getElementById('cnt-offgrid').innerText = off;

      document.getElementById('summary-text').innerText = 
        `🌐 ${pub} Public Vitrin  |  🔒 ${priv} Private Bulut Yedeği  |  ☣️ ${off} Off-Grid (Yerelde Dursun)`;
    }

    function copyFinalList() {
      const summaryObj = {
        public: [],
        private: [],
        offgrid: []
      };

      projectsData.forEach(p => {
        const choice = userSelections[p.id];
        summaryObj[choice].push({ id: p.id, name: p.name, path: p.path });
      });

      const text = JSON.stringify(summaryObj, null, 2);
      navigator.clipboard.writeText(text);
      alert("✅ Seçimlerin hafızaya kopyalandı!\n\nÖzet:\n" + document.getElementById('summary-text').innerText + "\n\nŞimdi sohbet ekranına geçip 'Tamamdır seçtim' yazabilirsin!");
    }

    // Initial render
    render();
  </script>
</body>
